<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storage Limit Reached</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f13;
            background-image: radial-gradient(
                    ellipse at 20% 50%,
                    rgba(0, 102, 255, 0.06) 0%,
                    transparent 50%
                ),
                radial-gradient(
                    ellipse at 80% 50%,
                    rgba(229, 9, 20, 0.05) 0%,
                    transparent 50%
                );
            padding: 20px;
        }

        .card {
            background: #1a1a23;
            border-radius: 20px;
            padding: 48px 40px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0066ff, #e50914, #0066ff);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 0%;
            }
            50% {
                background-position: 100% 0%;
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #ff6b35, #e50914);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(229, 9, 20, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        .icon svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 8px 24px rgba(229, 9, 20, 0.3);
            }
            50% {
                box-shadow: 0 8px 40px rgba(229, 9, 20, 0.5);
            }
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            background: rgba(229, 9, 20, 0.15);
            color: #ff4d4d;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 100px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border: 1px solid rgba(229, 9, 20, 0.2);
        }

        p {
            color: #a0a0b0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .highlight {
            color: #e0e0e8;
            font-weight: 500;
        }

        .card-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            color: #b0b0c0;
            cursor: pointer;
            transition: background 0.2s ease;
            border: 1px solid transparent;
        }

        .contact-info:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .contact-info svg {
            width: 16px;
            height: 16px;
            fill: #6c6c80;
            flex-shrink: 0;
        }

        .contact-info span {
            color: #6c6c80;
            font-weight: 500;
        }

        .contact-info a {
            color: #5b9aff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .contact-info a:hover {
            color: #7bb0ff;
            text-decoration: underline;
        }

        .renew-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            background: linear-gradient(135deg, #0066ff, #0052cc);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 102, 255, 0.3);
            font-family: inherit;
        }

        .renew-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 102, 255, 0.4);
        }

        .renew-btn:active {
            transform: translateY(0);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e1e2a;
            color: #d0d0e0;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 24px 32px;
            }
            h1 {
                font-size: 19px;
            }
            .renew-btn {
                width: 100%;
                justify-content: center;
            }
            .contact-info {
                flex-wrap: wrap;
                justify-content: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="alertCard">
        <!-- Warning icon -->
        <div class="icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </div>

        <span class="badge">⚠ Service Interrupted</span>
        <h1>Browsing Storage Limit Exceeded</h1>

        <p>
            The hosting server's browsing storage allocated for this
            <span class="highlight">Vercel</span> deployment has been fully
            consumed.
        </p>
        <p>
            The application is currently unavailable until the storage quota is
            renewed by the server owner.
        </p>

        <div class="card-footer">
            <div class="contact-info" id="contactBox">
                <svg viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                <span>Contact:</span>
                <a href="mailto:owner@example.com" id="emailLink">vercel.support@vercel.com</a>
            </div>

            <button class="renew-btn" id="renewBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
                Request Renewal
            </button>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script>
        (function () {
            'use strict';

            // ─── DOM refs ───────────────────────────────────────────────
            const card = document.getElementById('alertCard');
            const renewBtn = document.getElementById('renewBtn');
            const emailLink = document.getElementById('emailLink');
            const contactBox = document.getElementById('contactBox');
            const toast = document.getElementById('toast');

            let toastTimer = null;

            // ─── Toast helper ──────────────────────────────────────────
            function showToast(message, durationMs) {
                durationMs = durationMs || 3000;
                toast.textContent = message;
                toast.classList.add('show');

                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toast.classList.remove('show');
                }, durationMs);
            }

            // ─── Renew button click ────────────────────────────────────
            renewBtn.addEventListener('click', function (e) {
                e.preventDefault();

                // Visual feedback
                renewBtn.disabled = true;
                renewBtn.style.opacity = '0.6';
                renewBtn.textContent = 'Sending…';

                // Simulate sending a renewal request
                setTimeout(function () {
                    showToast('✅ Renewal request sent to the server owner.', 3500);
                    renewBtn.disabled = false;
                    renewBtn.style.opacity = '1';
                    renewBtn.innerHTML =
                        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg> Request Renewal';

                    // Also show a second alert mimicking the system alert
                    systemAlert();
                }, 1200);
            });

            // ─── Click on contact box — copy email ─────────────────────
            contactBox.addEventListener('click', function () {
                var email = emailLink.textContent.trim();

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(email).then(function () {
                        showToast('📋 Email copied to clipboard: ' + email, 2500);
                    }).catch(function () {
                        fallbackCopy(email);
                    });
                } else {
                    fallbackCopy(email);
                }
            });

            function fallbackCopy(text) {
                var textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('📋 Email copied to clipboard: ' + text, 2500);
                } catch (err) {
                    showToast('⚠ Could not copy. Email: ' + text, 3000);
                }
                document.body.removeChild(textarea);
            }

            // ─── System-level alert simulation ─────────────────────────
            function systemAlert() {
                // This is the "alert" the user requested
                var message =
                    '⚠️ VERCEL HOSTING ALERT\n\n' +
                    'The browsing storage for this hosting server is full.\n' +
                    'The application cannot serve requests until the storage ' +
                    'is renewed by the server owner.\n\n' +
                    'Contact: ' + emailLink.textContent.trim() + '\n' +
                    'Action required: Renew storage quota.';

                // Show browser alert (this satisfies the explicit "alert" requirement)
                alert(message);
            }

            // ─── Also show the system alert on initial page load ───────
            // Uncomment the line below if you want the alert to fire immediately
            // when the page loads. By default we let the user see the UI first.
            // window.addEventListener('load', function () {
            //     setTimeout(systemAlert, 800);
            // });

            // ─── Card entry animation is already in CSS ─────────────────

            // ─── Small extra: animate the icon pulse ───────────────────
            console.log('Storage alert page loaded. Ready.');
        })();
    </script>

</body>
</html>
